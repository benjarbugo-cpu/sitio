kind = "web"
previewPath = "/"
title = "Sitio Camarin Rice Mill"
description = "A database-backed rice mill management system for Sitio Camarin, covering farmers, rice receiving, milling transactions, inventory, payments, expenses, reports, and role-separated admin and farmer dashboards."
version = "1.0.0"
id = "artifacts/camarin-rice-mill"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24734

[services.development]
run = "pnpm --filter @workspace/camarin-rice-mill run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/camarin-rice-mill", "run", "build" ]
serve = "static"
publicDir = "artifacts/camarin-rice-mill/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24734"
BASE_PATH = "/"
